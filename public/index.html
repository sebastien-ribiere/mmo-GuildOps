<!doctype html>
<html lang="fr">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GuildOps — Le Grand Tournoi</title><link rel="stylesheet" href="/style.css"></head>
<body>
<header><p>CASTOR &amp; CHIMÈRES</p><h1>GuildOps — Le Grand Tournoi</h1></header>
<main>
<section id="login"><h2>Entrer dans le village</h2><form id="join"><label>Nom de l'aventurier <input id="name" required maxlength="32" autocomplete="off"></label><button>Entrer</button></form></section>
<section id="play" hidden><div class="layout"><div><canvas id="world" width="800" height="520" aria-label="Village isométrique"></canvas><p>Déplacement : flèches ou ZQSD. Rejoins le maître de guilde au centre.</p><div class="controls"><button data-move="0,-1">↑</button><button data-move="-1,0">←</button><button data-move="1,0">→</button><button data-move="0,1">↓</button></div></div><aside><h2 id="hero"></h2><h3>Quête</h3><p id="quest"></p><button id="accept">Accepter la quête</button><button id="talk">Parler</button><h3>Inventaire</h3><p id="inventory"></p><button id="logout">Changer de joueur</button></aside></div></section>
<p id="status" role="status" aria-live="polite"></p>
</main><footer>Prototype M1a — sauvegarde volatile, illustrations temporaires.</footer><script type="module" src="/app.js"></script>
</body></html>
