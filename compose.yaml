services:
  db:
    image: postgres:17-bookworm
    environment:
      POSTGRES_DB: guildops
      POSTGRES_USER: guildops
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?copy .env.example to .env and set a lab password}
    volumes:
      - guildops-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U guildops -d guildops"]
      interval: 3s
      timeout: 3s
      retries: 20
    restart: unless-stopped
  app:
    build: .
    environment:
      DATABASE_URL: postgres://guildops:${POSTGRES_PASSWORD}@db:5432/guildops
    ports:
      - "127.0.0.1:${APP_PORT:-8080}:8080"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:8080/readyz').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 4s
      retries: 20
    restart: unless-stopped
volumes:
  guildops-data:
